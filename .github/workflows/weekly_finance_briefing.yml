name: Weekly Finance & Agentic AI Intelligence Briefing

on:
  schedule:
    # 03:25 UTC = 08:55 AM IST every Saturday (Offsets slightly from peak :30 to avoid GitHub runner queue delays)
    - cron: '25 3 * * 6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not send email, upload output artifacts)'
        required: false
        default: 'false'
        type: boolean
      hours:
        description: 'Lookback window in hours'
        required: false
        default: '168'
        type: string

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Finance Briefing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TIMEZONE: 'Asia/Kolkata'
          HOURS_LOOKBACK: ${{ inputs.hours || '168' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python src/scheduler.py --now --dry-run --hours ${{ inputs.hours || 168 }}
          else
            python src/scheduler.py --now --hours ${{ inputs.hours || 168 }}
          fi

      - name: Upload Briefing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-finance-briefing-output
          path: output/
          retention-days: 14

